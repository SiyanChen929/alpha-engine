model:
  minimum_history_months: 60
  refit_frequency: annual
  recency_half_life_years: 5
  ensemble_weights:
    ridge: 0.20
    extra_trees: 0.45
    histogram_gbdt: 0.35
  extra_trees:
    n_estimators: 300
    min_samples_leaf: 20
    max_features: 0.65
  histogram_gbdt:
    max_iter: 250
    learning_rate: 0.04
    max_leaf_nodes: 15
    l2_regularization: 1.0

portfolio:
  long_quantile: 0.20
  short_quantile: 0.20
  gross_exposure: 1.0
  max_name_weight: 0.10
  standardized_exposure_tolerance: 0.15
  trading_cost_bps_one_way: 15
  annual_short_borrow_bps: 200
  cost_sensitivity_bps: [5, 15, 25, 50]

gates:
  holdout_sharpe_minimum: 0.50
  newey_west_tstat_minimum: 2.00
  bootstrap_sharpe_p05_minimum: 0.00
  maximum_drawdown_floor: -0.20
